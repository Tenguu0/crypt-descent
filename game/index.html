<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crypt Descent — a roguelike dungeon crawler</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="640" tabindex="0"></canvas>
  <div id="touch">
    <div class="pad" id="pad-move">
      <button data-k="up" aria-label="Move up">&#9650;</button>
      <button data-k="left" aria-label="Move left">&#9664;</button>
      <button data-k="down" aria-label="Move down">&#9660;</button>
      <button data-k="right" aria-label="Move right">&#9654;</button>
    </div>
    <div class="pad" id="pad-act">
      <button data-k="dash" aria-label="Dash">DASH</button>
      <button data-k="attack" aria-label="Attack">ATK</button>
      <button data-k="use" aria-label="Interact">USE</button>
    </div>
  </div>
  <div id="hint">WASD / arrows move &middot; SPACE attack &middot; SHIFT dash &middot; E interact &middot; Q potion &middot; M sound</div>
</div>
<script src="js/audio.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/game.js"></script>
</body>
</html>
